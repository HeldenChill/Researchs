<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Bloom Slice</title>
<style>
  :root { --bg: #1d1f1a; --fg: #e8e6dc; --muted: #a29f92; --accent: #c9b458; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  #fallback { max-width: 520px; background: #3a2a1a; border: 1px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; }
  #fallback code { color: var(--accent); }
  canvas { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; cursor: pointer; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; background: #2c2f27; color: var(--fg); border: 2px solid transparent; border-radius: 6px; padding: 6px 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  button.sel { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  #trend { font-size: 28px; width: 36px; text-align: center; }
  #msg { min-height: 1.4em; color: var(--muted); }
</style>
</head>
<body>
<div id="fallback">The game did not load. Run <code>python -m http.server 8000</code> in <code>prototypes/forest-bloom-slice</code>, then open <code>http://localhost:8000/web/</code></div>
<div class="bar" id="seeds"></div>
<canvas id="map" width="480" height="480"></canvas>
<div class="bar"><span id="trend" title="forest health">·</span><button id="restart">Restart</button></div>
<div id="msg"></div>
<script type="module" src="main.js"></script>
</body>
</html>
