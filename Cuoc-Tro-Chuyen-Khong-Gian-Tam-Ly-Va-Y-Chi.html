 điều hòa giúp tăng ngưỡng dung sai cho đồng đội xung quanh.\n* **Mục 6 - Kịch bản 3:** Thêm tình huống điển hình về *Sự hy sinh anh hùng vượt qua bản năng sinh tồn* (nhân vật Sarah kích hoạt toán tử ý chí để chặn quái vật cứu đồng đội).\n\n---\n\n### 2. Lưu Toàn Bộ Cuộc Trò Chuyện Thành File HTML Trực Quan\nToàn bộ 44 lượt đối thoại của chúng ta đã được biên dịch và đóng gói thành một trang Web hoàn chỉnh tại:\n👉 **[`Cuoc-Tro-Chuyen-Khong-Gian-Tam-Ly-Va-Y-Chi.html`](file:///g:/Projects/Researchs/Cuoc-Tro-Chuyen-Khong-Gian-Tam-Ly-Va-Y-Chi.html)**\n\n#### Các tính năng kỹ thuật nổi bật của file HTML:\n* **Giao diện Web Chat hiện đại:** Thiết kế Dark Mode cao cấp (Glassmorphism, phân biệt bong bóng chat giữa Bạn và AI, typography Inter & Fira Code sắc nét).\n* **Hiển thị Công thức Toán học chuẩn mực (KaTeX):** Mọi công thức vi phân $\\frac{d\\vec{S}}{dt}$, hàm thế năng $V(\\vec{S})$, ma trận coupling, vector trạng thái đều được biên dịch tự động thành công thức toán học chuyên nghiệp.\n* **Hiển thị Đồ thị & Sơ đồ động (Mermaid.js):** Toàn bộ các sơ đồ hệ không gian, sơ đồ chuyển pha, cây tiến hóa và vòng lặp hồi tiếp vũ trụ đều được render thành hình ảnh SVG trực quan, không còn bị kẹt ở dạng văn bản thô.\n* **Tự do trải nghiệm:** Bạn chỉ cần **nhấp đúp chuột để mở trực tiếp file HTML này trên bất kỳ trình duyệt nào** (Chrome, Edge, Firefox, Brave...).\n\n*(Lưu ý nhỏ: Trình duyệt nội bộ tự động của hệ thống gặp hạn chế mạng khi tải driver Playwright, nhưng file HTML là độc lập và mở mượt mà 100% trên trình duyệt cá nhân của bạn).*\n\nChúc bạn có một buổi tối thật thư thái và trọn vẹn!"}, {"role": "user", "text": "có một số chỗ mermaid diagram bị quá bé, bạn điều chỉnh lại cho mình"}, {"role": "assistant", "text": "Tôi đã hoàn tất cả 2 yêu cầu của bạn:\n\n1. **Cập nhật ý tưởng về \"Ý chí\" vào tài liệu Game Design:** Đã bổ sung **Mục 3.4 (Toán tử ghi đè Gradient và Hào quang Ý chí)** và **Kịch bản 3 (Sự hy sinh anh hùng nổi sinh)** vào [`Thiet-Ke-Game-Mo-Phong-Tam-Ly-Emergence.md`](file:///g:/Projects/Researchs/Thiet-Ke-Game-Mo-Phong-Tam-Ly-Emergence.md).\n2. **Lưu toàn bộ cuộc đối thoại thành file HTML trực quan:** Toàn bộ 44 lượt trao đổi đã được đóng gói thành giao diện Web Chat hiện đại, tích hợp bộ giải mã toán học **KaTeX** và bộ vẽ đồ thị **Mermaid.js** để hiển thị trọn vẹn mọi công thức và sơ đồ."}]
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawMessages = JSON.parse(document.getElementById('messagesData').textContent);
            const container = document.getElementById('chatContainer');

            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                flowchart: {
                    useMaxWidth: false,
                    htmlLabels: true,
                    curve: 'basis',
                    padding: 24
                },
                sequence: {
                    useMaxWidth: false,
                    actorFontSize: 16,
                    messageFontSize: 15,
                    noteFontSize: 14,
                    width: 170,
                    height: 50
                },
                classDiagram: {
                    useMaxWidth: false
                },
                themeVariables: {
                    darkMode: true,
                    fontSize: '15px',
                    fontFamily: 'Inter, sans-serif',
                    background: '#060911',
                    primaryColor: '#1e293b',
                    primaryTextColor: '#f8fafc',
                    primaryBorderColor: '#38bdf8',
                    lineColor: '#818cf8',
                    secondaryColor: '#1e1b4b',
                    tertiaryColor: '#0f172a'
                }
            });

            // Configure marked
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true,
                gfm: true
            });

            // Process and append messages
            for (let i = 0; i < rawMessages.length; i++) {
                const msg = rawMessages[i];
                const isUser = msg.role === 'user';

                const row = document.createElement('div');
                row.className = `message-row ${isUser ? 'user' : 'assistant'}`;

                const avatar = document.createElement('div');
                avatar.className = `avatar ${isUser ? 'user-avatar' : 'ai-avatar'}`;
                avatar.textContent = isUser ? '👤' : '✨';

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';

                const sender = document.createElement('div');
                sender.className = 'sender-name';
                sender.textContent = isUser ? 'Bạn (User)' : 'Antigravity (AI)';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'content';

                let text = msg.text;

                // Step 1: Protect Mermaid Blocks
                const mermaidBlocks = [];
                text = text.replace(/```mermaid\s*([\s\S]*?)```/g, (match, code) => {
                    const placeholder = `@@MERMAID_${mermaidBlocks.length}@@`;
                    mermaidBlocks.push(code.trim());
                    return placeholder;
                });

                // Step 2: Protect Math Formulas from Marked.js (avoid mangling underscores & asterisks)
                const mathBlocks = [];
                // Protect display math $$ ... $$
                text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, math) => {
                    const placeholder = `@@MATH_DISPLAY_${mathBlocks.length}@@`;
                    mathBlocks.push({ math: math, display: true });
                    return placeholder;
                });
                // Protect inline math $ ... $
                text = text.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
                    const placeholder = `@@MATH_INLINE_${mathBlocks.length}@@`;
                    mathBlocks.push({ math: math, display: false });
                    return placeholder;
                });

                // Step 3: Render Markdown
                let renderedHtml = marked.parse(text);

                // Step 4: Restore Math Formulas
                mathBlocks.forEach((item, idx) => {
                    const placeholder = item.display ? `@@MATH_DISPLAY_${idx}@@` : `@@MATH_INLINE_${idx}@@`;
                    const mathDelimiter = item.display ? `$$${item.math}$$` : `$${item.math}$`;
                    renderedHtml = renderedHtml.replace(placeholder, mathDelimiter);
                });

                // Step 5: Restore Mermaid Blocks with Toolbar
                mermaidBlocks.forEach((code, idx) => {
                    const placeholder = `@@MERMAID_${idx}@@`;
                    const wrapperId = `mermaid-wrap-${i}-${idx}`;
                    const viewportId = `mermaid-view-${i}-${idx}`;
                    const wrapper = `
                    <div class="mermaid-wrapper" id="${wrapperId}">
                        <div class="mermaid-toolbar">
                            <button class="mermaid-tool-btn" onclick="zoomMermaid('${viewportId}', 1.25)">🔍 Phóng To</button>
                            <button class="mermaid-tool-btn" onclick="zoomMermaid('${viewportId}', 0.8)">🔍 Thu Nhỏ</button>
                            <button class="mermaid-tool-btn" onclick="resetMermaid('${viewportId}')">↺ Vừa Khung</button>
                        </div>
                        <div class="mermaid-viewport" id="${viewportId}" data-scale="1">
                            <div class="mermaid">${code}</div>
                        </div>
                    </div>`;
                    renderedHtml = renderedHtml.replace(placeholder, wrapper);
                });

                contentDiv.innerHTML = renderedHtml;

                bubble.appendChild(sender);
                bubble.appendChild(contentDiv);

                row.appendChild(avatar);
                row.appendChild(bubble);
                container.appendChild(row);

                // Step 6: Render KaTeX on the message element
                renderMathInElement(contentDiv, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }

            // Step 7: Render all Mermaid diagrams
            await mermaid.run();

            // Step 8: Post-process SVGs to remove restrictive max-width inline styles
            document.querySelectorAll('.mermaid svg').forEach(svg => {
                svg.style.maxWidth = 'none';
                svg.removeAttribute('max-width');
                if (svg.parentElement) {
                    svg.parentElement.style.overflow = 'visible';
                }
            });
        });

        // Interactive Zoom helpers for Mermaid Diagrams
        window.zoomMermaid = function(viewportId, factor) {
            const vp = document.getElementById(viewportId);
            if (!vp) return;
            let currentScale = parseFloat(vp.getAttribute('data-scale') || '1');
            currentScale = Math.min(Math.max(currentScale * factor, 0.5), 3.0);
            vp.setAttribute('data-scale', currentScale);
            vp.style.transform = `scale(${currentScale})`;
        };

        window.resetMermaid = function(viewportId) {
            const vp = document.getElementById(viewportId);
            if (!vp) return;
            vp.setAttribute('data-scale', '1');
            vp.style.transform = 'scale(1)';
        };
    </script>
